# Example: the app on PostgreSQL. NOT built or run in the environment this project was developed in (Docker unavailable): treat it as a
# starting point. Put a TLS-terminating reverse proxy in front of port 3000. Copy .env.example to .env and fill it in (never commit .env).
#   docker compose -f docker-compose.postgres.yml up -d --build
# For real production prefer a managed PostgreSQL with point-in-time recovery over the db container below.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodies
      POSTGRES_USER: foodies
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or an .env file}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodies -d foodies"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://foodies:${POSTGRES_PASSWORD}@db:5432/foodies
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app-uploads:/uploads
volumes:
  pg-data:
  app-uploads:
