# Example single-host deployment. Put a TLS-terminating reverse proxy (Caddy, nginx, Traefik) in front of port 3000.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env          # copy .env.example to .env and fill it in; never commit .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app-data:/data
      - app-uploads:/uploads
volumes:
  app-data:
  app-uploads:
