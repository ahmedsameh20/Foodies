<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="forgot.title">Reset your password | Foodies</title>
<link rel="icon" href="/Images/Restaurants/download.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="main" class="narrow">
  <div class="card">
    <h1 data-i18n="forgot.heading">Reset your password</h1>
    <p class="muted" data-i18n="forgot.intro">Enter your account email and we will send you a link to choose a new password.</p>
    <form id="form" novalidate>
      <div class="form-alert"></div>
      <div class="field"><label for="email" data-i18n="field.email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <button class="btn block" type="submit" data-i18n="forgot.send">Send reset link</button>
    </form>
    <p class="small muted" style="margin-top:1rem"><a href="/login.html" data-i18n="forgot.back">Back to sign in</a></p>
  </div>
</main>
<script type="module" src="/js/forgot.js"></script>
</body>
</html>
