<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password | Foodies</title>
<link rel="icon" href="/Images/Restaurants/download.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="main" class="narrow">
  <div class="card">
    <h1>Choose a new password</h1>
    <form id="form" novalidate>
      <div class="form-alert"></div>
      <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"><div class="hint">At least 8 characters, with letters and numbers.</div></div>
      <button class="btn block" type="submit">Save password</button>
    </form>
  </div>
</main>
<script type="module" src="/js/reset.js"></script>
</body>
</html>
