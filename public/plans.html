<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="plans.title">Plans for restaurants | Foodies</title>
<link rel="icon" href="/Images/Restaurants/download.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="main" class="wrap section">
  <h1 data-i18n="plans.heading">Choose a plan for your restaurant</h1>

  <div id="period" class="plan-period" role="radiogroup" data-i18n-aria-label="plans.billingPeriod" aria-label="Billing period" hidden></div>
  <div id="plans"><div class="spinner" role="status" aria-label="Loading"></div></div>
  <p class="small muted" style="margin-top:1.5rem"><span data-i18n="plans.haveAccount">Already have an owner account?</span> <a id="signin-link" href="/login.html" data-i18n="nav.signIn">Sign in</a></p>

<script type="module" src="/js/plans.js"></script>

</html>
