<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="login.title">Sign in | Foodies</title>
<link rel="icon" href="/Images/Restaurants/download.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="main" class="narrow">
  <div class="card">
    <h1 data-i18n="nav.signIn">Sign in</h1>
    <div id="next-note"></div>
    <form id="form" novalidate>
      <div class="form-alert"></div>
      <div class="field"><label for="email" data-i18n="field.email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password" data-i18n="field.password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn block" type="submit" data-i18n="nav.signIn">Sign in</button>
    </form>
    <p class="small" style="margin-top:1rem"><a href="/forgot-password.html" data-i18n="login.forgot">Forgot your password?</a></p>
    <p class="small muted"><span data-i18n="login.newHere">New here?</span> <a href="/register.html" data-i18n="login.createAccount">Create an account</a></p>
  </div>
</main>
<script type="module" src="/js/login.js"></script>
</body>
</html>
