<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin sign in | Foodies</title>
<link rel="icon" href="/Images/Restaurants/download.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="main" class="narrow">
  <div class="card">
    <h1>Platform admin</h1>
    <p class="muted">Sign in with your administrator account.</p>
    <div id="next-note"></div>
    <form id="form" novalidate>
      <div class="form-alert"></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn block" type="submit">Sign in</button>
    </form>
    <form id="mfa" class="hidden" novalidate>
      <div class="form-alert"></div>
      <p>Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
      <div class="field"><label for="code">Verification code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required></div>
      <button class="btn block" type="submit">Verify</button>
    </form>
    <p class="small muted" style="margin-top:1rem">Restaurant or customer? <a href="/login.html">Use the regular sign in</a>.</p>
  </div>
</main>
<script type="module" src="/js/admin-login.js"></script>
</body>
</html>
