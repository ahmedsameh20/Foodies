<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title data-i18n="admlogin.title">Admin sign in | Foodies</title>
<link rel="icon" href="/Images/Restaurants/download.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="main" class="narrow">
  <div class="card">
    <h1 data-i18n="admlogin.heading">Platform admin</h1>
    <p class="muted" data-i18n="admlogin.intro">Sign in with your administrator account.</p>
    <div id="next-note"></div>
    <form id="form" novalidate>
      <div class="form-alert"></div>
      <div class="field"><label for="email" data-i18n="field.email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password" data-i18n="field.password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn block" type="submit" data-i18n="nav.signIn">Sign in</button>
    </form>
    <form id="mfa" class="hidden" novalidate>
      <div class="form-alert"></div>
      <p data-i18n="admlogin.mfaIntro">Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
      <div class="field"><label for="code" data-i18n="login.mfaCode">Verification code</label><input id="code" name="code" inputmode="numeric" dir="ltr" autocomplete="one-time-code" required></div>
      <button class="btn block" type="submit" data-i18n="login.verify">Verify</button>
    </form>
    <p class="small muted" style="margin-top:1rem"><span data-i18n="admlogin.regular">Restaurant or customer?</span> <a href="/login.html" data-i18n="admlogin.regularLink">Use the regular sign in</a>.</p>
  </div>
</main>
<script type="module" src="/js/admin-login.js"></script>
</body>
</html>
